[pytest]
#★ 本机应用控制策略拦掉了 uuid_utils 的 DLL，而 langsmith 会【自动注册一个 pytest 插件】
#   （entry_points 里声明的），它在 pytest 启动阶段就import uuid_utils ——
#   比 tests/conftest.py 和 service.py 都早，所以 service.py 里的 ensure_uuid_utils()
#   根本来不及救（实测 pytest 会直接在启动阶段崩，连收集都没开始）。
#
#   -p no:langsmith_plugin 就是把那层自动注册关掉。
#   为什么这样比"在 conftest 里修"更对：
#     conftest.py 是 pytest 在【收集阶段】才加载的，而插件在【更早的启动阶段】就import 了。
#     能力必须装在入口早的地方 —— 跟 env_compat 必须在 import fastembed 之前同一个道理。
#
#   关掉它有什么代价？本项目【不使用 LangSmith 追踪】
#   （环境变量 LANGSMITH_TRACING 没设、跑的是离线评测），所以关掉零影响。
#   将来真要接LangSmith，得先保证 uuid_utils 的 DLL 能被策略放行，而不是靠这个开关。
addopts = -p no:langsmith_plugin --log-level=WARNING
testpaths = tests

# ★ --log-level=WARNING（2026-10-10 加）：
#   原因是kb.loader 的清洗明细已经降到 DEBUG，正常跑测试不该被刷屏。
#   为什么保留 WARNING 而不是 --log-level=ERROR：
#     真出问题时（LLM 调用失败、降级发生）那些 warning 是【唯一的现场】，
#     一并藏掉就等于在测试输出里制造"看起来一切正常"的假象。
#   代价：跑 pytest 仍会看到真实异常类的 warning，这是有意保留的。
#   想看清洗明细：加 -o log_cli=true --log-level=DEBUG。